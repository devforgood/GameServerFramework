syntax = "proto3";

package gamedata;

message Skill {
  int32 id = 1;
  string type = 2;
  double cooldown = 3;
  double damage = 4;
  double mana_cost = 5;
  string effect = 6;
  double value = 7;
  string name_id = 8;
  string desc_id = 9;
}

message SkillList {
  repeated Skill skills = 1;
}

message Option {
	int32 id = 1;
	double value = 2;
}

message Item {
  int32 id = 1;
  string type = 2;
  int32 heal = 3;
  string name_id = 4;
  string desc_id = 5;
  repeated Option item_options = 6;
}

message ItemList {
  repeated Item items = 1;
}