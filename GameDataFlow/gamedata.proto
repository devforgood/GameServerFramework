syntax = "proto3";

package gamedata;

message Skill {
  int32 id = 1;
  string type = 2;
  double cooldown = 3;
  double damage = 4;
  double mana_cost = 5;
  string effect = 6;
  double value = 7;
  string name_id = 8;
  string desc_id = 9;
  double duration = 10;
  double hieght = 11;
  double range = 12;
  double min_damage = 13;
  double max_damage = 14;
  string code_name = 15;
  double angle = 16;
}

message SkillList {
  repeated Skill skills = 1;
}

message Option {
	int32 id = 1;
	double value = 2;
}

message Item {
  int32 id = 1;
  string type = 2;
  int32 heal = 3;
  string name_id = 4;
  string desc_id = 5;
  repeated Option item_options = 6;
}

message ItemList {
  repeated Item items = 1;
}

message Quest {
  int32 id = 1;
  string type = 2;
  string name_id = 3;
  string desc_id = 4;
  int32 level_requirement = 5;
  repeated int32 reward_item_ids = 6;
  int32 reward_exp = 7;
  int32 reward_gold = 8;
  bool is_repeatable = 9;
  string objective_type = 10;
  int32 objective_count = 11;
  int32 objective_target_id = 12;
}

message QuestList {
  repeated Quest quests = 1;
}